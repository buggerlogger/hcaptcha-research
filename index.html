<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hcap research</title>
<style>
  :root {
    --paper: #f3efe6;
    --ink: #1d1a16;
    --muted: #5e584e;
    --line: #d9d1c3;
    --side: #e7e1d4;
    --mark: #1f4d3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 18px/1.55 Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
  }
  .layout { display: flex; min-height: 100%; }
  nav {
    width: 230px;
    flex: none;
    background: var(--side);
    border-right: 1px solid var(--line);
    padding: 22px 14px 40px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: auto;
  }
  nav .brand {
    font: 600 13px/1.3 ui-sans-serif, "Segoe UI", sans-serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 8px 16px;
  }
  nav a {
    display: block;
    color: var(--ink);
    text-decoration: none;
    font: 15px/1.3 ui-sans-serif, "Segoe UI", sans-serif;
    padding: 7px 8px;
    border-radius: 4px;
  }
  nav a.on { background: #d8d0c0; }
  nav a:hover { background: #ddd6c8; }
  main {
    flex: 1;
    min-width: 0;
    padding: 36px 28px 80px;
  }
  article {
    max-width: 740px;
    margin: 0 auto;
  }
  article h1 {
    font-size: 34px;
    font-weight: 600;
    line-height: 1.15;
    margin: 0 0 18px;
  }
  article h2 {
    font-size: 22px;
    font-weight: 600;
    margin: 32px 0 10px;
  }
  article p { margin: 0 0 14px; }
  article em { font-style: italic; }
  article img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 8px 0 6px;
    background: #fff;
    border: 1px solid var(--line);
  }
  article a { color: var(--mark); }
  article code {
    font: 15px/1.4 ui-monospace, Consolas, monospace;
    background: #e6e0d4;
    padding: 0 4px;
  }
  article table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0 18px;
    font-size: 16px;
  }
  article th, article td {
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
    padding: 7px 10px 7px 0;
  }
  article th { font-weight: 600; }
  .err { color: #8a2a1a; }
  @media (max-width: 760px) {
    .layout { display: block; }
    nav {
      width: auto;
      height: auto;
      position: static;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      padding: 12px;
      display: flex;
      gap: 4px;
      overflow: auto;
    }
    nav .brand { display: none; }
    nav a { white-space: nowrap; }
    main { padding: 22px 16px 48px; }
    article h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav">
    <p class="brand">hcap research</p>
  </nav>
  <main><article id="doc"><p>Loading.</p></article></main>
</div>
<script>
const NOTES = [
  ["", "Notes", "README.md"],
  ["piece-drag", "Piece drag", "piece_drag/README.md"],
  ["letter-fits", "Letter fits", "letter_fits/README.md"],
  ["outline-match", "Outline match", "outline_match/README.md"],
  ["ring", "Ring complete", "ring_complete/README.md"],
  ["both-shapes", "Both shapes", "xboth/README.md"],
  ["screw", "Screw", "screw/README.md"],
  ["shape-grid", "Shape grid", "shape_grid/README.md"],
  ["vial", "Vial", "vial/README.md"],
  ["scale", "Scale", "scale/README.md"],
  ["tiles", "Tile boards", "label_binary/README.md"],
  ["area", "Area select", "area_select/README.md"],
  ["video", "Video", "video/README.md"]
];

function siteBase() {
  const path = location.pathname;
  const mark = "/hcap-research/";
  const at = path.indexOf(mark);
  if (at >= 0) return path.slice(0, at + mark.length);
  return path.endsWith("/") ? path : path.replace(/[^/]*$/, "");
}
const BASE = siteBase();

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function inline(raw) {
  const re = /!\[([^\]]*)\]\(([^)]+)\)|\[([^\]]+)\]\(([^)]+)\)|`([^`]+)`|\*([^*]+)\*/g;
  let out = "";
  let i = 0;
  let m;
  while ((m = re.exec(raw))) {
    out += esc(raw.slice(i, m.index));
    if (m[0].charAt(0) === "!") out += '<img alt="' + esc(m[1]) + '" data-src="' + esc(m[2]) + '">';
    else if (m[3] !== undefined) out += '<a href="' + esc(m[4]) + '">' + esc(m[3]) + "</a>";
    else if (m[5] !== undefined) out += "<code>" + esc(m[5]) + "</code>";
    else out += "<em>" + esc(m[6]) + "</em>";
    i = m.index + m[0].length;
  }
  return out + esc(raw.slice(i));
}

function render(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const parts = [];
  let para = [];
  function flush() {
    if (!para.length) return;
    parts.push("<p>" + inline(para.join(" ")) + "</p>");
    para = [];
  }
  for (let n = 0; n < lines.length; n++) {
    const line = lines[n];
    const head = /^(#{1,3}) +(.+)$/.exec(line);
    if (head) {
      flush();
      const level = head[1].length;
      parts.push("<h" + level + ">" + inline(head[2]) + "</h" + level + ">");
      continue;
    }
    if (line.trim().startsWith("|")) {
      flush();
      const rows = [];
      while (n < lines.length && lines[n].trim().startsWith("|")) {
        rows.push(lines[n]);
        n++;
      }
      n--;
      const kept = rows.filter(function (row) {
        const body = row.replace(/^\s*\|/, "").replace(/\|\s*$/, "");
        return !/^\s*:?-{3,}[\s|:-]*$/.test(body);
      });
      const parsed = kept.map(function (row) {
        return row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function (c) { return c.trim(); });
      });
      if (!parsed.length) continue;
      let html = "<table><thead><tr>";
      parsed[0].forEach(function (c) { html += "<th>" + inline(c) + "</th>"; });
      html += "</tr></thead><tbody>";
      for (let r = 1; r < parsed.length; r++) {
        html += "<tr>";
        parsed[r].forEach(function (c) { html += "<td>" + inline(c) + "</td>"; });
        html += "</tr>";
      }
      html += "</tbody></table>";
      parts.push(html);
      continue;
    }
    if (!line.trim()) {
      flush();
      continue;
    }
    para.push(line.trim());
  }
  flush();
  return parts.join("\n");
}

function noteByFile(file) {
  for (let i = 0; i < NOTES.length; i++) if (NOTES[i][2] === file) return NOTES[i];
  return null;
}
function noteBySlug(slug) {
  for (let i = 0; i < NOTES.length; i++) if (NOTES[i][0] === slug) return NOTES[i];
  return NOTES[0];
}
function resolvePath(fromFile, href) {
  const base = fromFile.split("/").slice(0, -1);
  href.split("/").forEach(function (part) {
    if (part === "..") base.pop();
    else if (part && part !== ".") base.push(part);
  });
  return base.join("/");
}

let current = NOTES[0];

function paintNav() {
  const nav = document.getElementById("nav");
  NOTES.forEach(function (note) {
    const a = document.createElement("a");
    a.href = "#" + note[0];
    a.textContent = note[1];
    a.className = note[2] === current[2] ? "on" : "";
    nav.appendChild(a);
  });
}

function show(note) {
  current = note;
  document.querySelectorAll("#nav a").forEach(function (a) {
    a.className = a.getAttribute("href") === "#" + note[0] ? "on" : "";
  });
  const doc = document.getElementById("doc");
  doc.innerHTML = "<p>Loading.</p>";
  fetch(BASE + note[2])
    .then(function (res) {
      if (!res.ok) throw new Error("missing " + note[2]);
      return res.text();
    })
    .then(function (md) {
      doc.innerHTML = render(md);
      document.title = note[1] + " - hcap research";
      doc.querySelectorAll("img").forEach(function (img) {
        img.src = BASE + resolvePath(note[2], img.getAttribute("data-src"));
      });
      doc.querySelectorAll("a").forEach(function (a) {
        const href = a.getAttribute("href");
        if (!href || /^https?:/.test(href) || href.charAt(0) === "#") return;
        const path = resolvePath(note[2], href);
        const linked = noteByFile(path);
        if (!linked) return;
        a.href = "#" + linked[0];
        a.addEventListener("click", function (ev) {
          ev.preventDefault();
          location.hash = linked[0];
        });
      });
      window.scrollTo(0, 0);
    })
    .catch(function (err) {
      doc.innerHTML = '<p class="err">' + esc(String(err.message || err)) + "</p>";
    });
}

paintNav();
function fromHash() {
  show(noteBySlug(location.hash.replace(/^#/, "")));
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
</html>
