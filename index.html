  .pager .next { margin-left: auto; }

  .social a:hover { color: var(--ink); background: #ddd6c8; }
  .social svg { width: 20px; height: 20px; display: block; fill: currentColor; }
  @media (max-width: 760px) {

    main { padding: 22px 16px 96px; }
    article h1 { font-size: 28px; }

<script>
const NOTES = [
  ["", "Notes", "README.md"],
  ["screw", "Screw", "screw/README.md"],
  ["letter-fits", "Letter fits", "letter_fits/README.md"],
  ["area", "Area select", "area_select/README.md"],
  ["video", "Video", "video/README.md"],
  ["tiles", "Tile boards", "label_binary/README.md"],
  ["both-shapes", "Both shapes", "xboth/README.md"],
  ["vial", "Vial", "vial/README.md"],
  ["piece-drag", "Piece drag", "piece_drag/README.md"],
  ["scale", "Scale", "scale/README.md"],
  ["shape-grid", "Shape grid", "shape_grid/README.md"],
  ["outline-match", "Outline match", "outline_match/README.md"],
  ["ring", "Ring complete", "ring_complete/README.md"]
];

function siteBase() {
  const path = location.pathname;
  const mark = "/hcaptcha-research/";
  const at = path.indexOf(mark);
  if (at >= 0) return path.slice(0, at + mark.length);
  return path.endsWith("/") ? path : path.replace(/[^/]*$/, "");
}
const BASE = siteBase();

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function inline(raw) {
  const re = /!\[([^\]]*)\]\(([^)]+)\)|\[([^\]]+)\]\(([^)]+)\)|`([^`]+)`|\*([^*]+)\*/g;
  let out = "";
  let i = 0;
  let m;
  while ((m = re.exec(raw))) {
    out += esc(raw.slice(i, m.index));
    if (m[0].charAt(0) === "!") out += '<img alt="' + esc(m[1]) + '" data-src="' + esc(m[2]) + '">';
    else if (m[3] !== undefined) out += '<a href="' + esc(m[4]) + '">' + esc(m[3]) + "</a>";
    else if (m[5] !== undefined) out += "<code>" + esc(m[5]) + "</code>";
    else out += "<em>" + esc(m[6]) + "</em>";
    i = m.index + m[0].length;
  }
  return out + esc(raw.slice(i));
}

function render(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const parts = [];
  let para = [];
  function flush() {
    if (!para.length) return;
    parts.push("<p>" + inline(para.join(" ")) + "</p>");
    para = [];
  }
  for (let n = 0; n < lines.length; n++) {
    const line = lines[n];
    const head = /^(#{1,3}) +(.+)$/.exec(line);
    if (head) {
      flush();
      const level = head[1].length;
      parts.push("<h" + level + ">" + inline(head[2]) + "</h" + level + ">");
      continue;
    }
    if (line.trim().startsWith("|")) {
      flush();
      const rows = [];
      while (n < lines.length && lines[n].trim().startsWith("|")) {
        rows.push(lines[n]);
        n++;
      }
      n--;
      const kept = rows.filter(function (row) {
        const body = row.replace(/^\s*\|/, "").replace(/\|\s*$/, "");
        return !/^\s*:?-{3,}[\s|:-]*$/.test(body);
      });
      const parsed = kept.map(function (row) {
        return row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function (c) { return c.trim(); });
      });
      if (!parsed.length) continue;
      let html = "<table><thead><tr>";
      parsed[0].forEach(function (c) { html += "<th>" + inline(c) + "</th>"; });
      html += "</tr></thead><tbody>";
      for (let r = 1; r < parsed.length; r++) {
        html += "<tr>";
        parsed[r].forEach(function (c) { html += "<td>" + inline(c) + "</td>"; });
        html += "</tr>";
      }
      html += "</tbody></table>";
      parts.push(html);
      continue;
    }
    if (!line.trim()) {
      flush();
      continue;
    }
    para.push(line.trim());
  }
  flush();
  return parts.join("\n");
}

function noteByFile(file) {
  for (let i = 0; i < NOTES.length; i++) if (NOTES[i][2] === file) return NOTES[i];
  return null;
}
function noteBySlug(slug) {
  for (let i = 0; i < NOTES.length; i++) if (NOTES[i][0] === slug) return NOTES[i];
  return NOTES[0];
}
function resolvePath(fromFile, href) {
  const base = fromFile.split("/").slice(0, -1);
  href.split("/").forEach(function (part) {
    if (part === "..") base.pop();
    else if (part && part !== ".") base.push(part);
  });
  return base.join("/");
}

let current = NOTES[0];

function paintNav() {
  const nav = document.getElementById("nav");
  NOTES.forEach(function (note) {
    const a = document.createElement("a");
    a.href = "#" + note[0];
    a.textContent = note[1];
    a.className = note[2] === current[2] ? "on" : "";
    nav.appendChild(a);
  });
}

function show(note) {
  current = note;
  document.querySelectorAll("#nav a").forEach(function (a) {
    a.className = a.getAttribute("href") === "#" + note[0] ? "on" : "";
  });
  const doc = document.getElementById("doc");
  doc.innerHTML = "<p>Loading.</p>";
  fetch(BASE + note[2])
    .then(function (res) {
      if (!res.ok) throw new Error("missing " + note[2]);
      return res.text();
    })
    .then(function (md) {
      doc.innerHTML = render(md);
      document.title = note[1] + " - hCaptcha research";
      doc.querySelectorAll("img").forEach(function (img) {
        img.src = BASE + resolvePath(note[2], img.getAttribute("data-src"));
      });
      doc.querySelectorAll("a").forEach(function (a) {
        const href = a.getAttribute("href");
        if (!href || /^https?:/.test(href) || href.charAt(0) === "#") return;
        const path = resolvePath(note[2], href);
        const linked = noteByFile(path);
        if (!linked) return;
        a.href = "#" + linked[0];
        a.addEventListener("click", function (ev) {
          ev.preventDefault();
          location.hash = linked[0];
        });
      });
      window.scrollTo(0, 0);
      paintPager();
    })
    .catch(function (err) {
      doc.innerHTML = '<p class="err">' + esc(String(err.message || err)) + "</p>";
      paintPager();
    });
}

function paintPager() {
  const pager = document.getElementById("pager");
  let i = 0;
  for (; i < NOTES.length; i++) if (NOTES[i][2] === current[2]) break;
  const prev = i > 0 ? NOTES[i - 1] : null;
  const next = i < NOTES.length - 1 ? NOTES[i + 1] : null;
  function side(note, label, cls) {
    if (!note) return '<span class="' + cls + '">' + label + "</span>";
    return '<a class="' + cls + '" href="#' + note[0] + '">' + label + "</a>";
  }
  pager.innerHTML = side(prev, "Previous", "prev") + side(next, "Next", "next");
}

paintNav();
function fromHash() {
  show(noteBySlug(location.hash.replace(/^#/, "")));
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
